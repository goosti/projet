name: Qualité du code
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
jobs:
  audit:
      runs-on: ubuntu-latest
      steps:
        - name: Récupérer le dépôt
          uses: actions/checkout@v4
        - name: Récupérer le cache Composer
          id: composer-cache
          run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        - name: Installer PHP
          uses: shivammathur/setup-php@v2
          with:
              php-version: '8.5'
              extensions: mbstring, intl
        - name: Mise en cache
          uses: actions/cache@v4
          with:
            path: ${{ steps.composer-cache.outputs.dir }}
            key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
            restore-keys: ${{ runner.os }}-composer-
        - name: Installer les dépendances Composer
          run: composer install --no-progress --no-interaction --prefer-dist
        - name: Lancer l'audit de sécurité
          run: composer audit
        - name: Vérification du style avec php cs-fixer
          run: vendor/bin/php-cs-fixer fix --dry-run
        - name: Analyse statique avec PHPStan
          run: vendor/bin/phpstan analyse -c phpstan.dist.neon --no-progress
        - name: Linter Twig
          run: php bin/console lint:twig templates/
        - name: Linter YAML
          run: php bin/console lint:yaml config/
        - name: Linter les containers de services
          run: php bin/console lint:container --no-debug
        - name: Vérification des entités Doctrine
          run: php bin/console doctrine:schema:validate --skip-sync -vvv --no-interaction
